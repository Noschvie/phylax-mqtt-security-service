# Dependency updates as pull requests (design 7.8). Every pull request
# runs ci.yml and integration.yml before it can be merged.
#
# Not covered here: the go directive in go.mod and the switch to the next
# Go minor version. maintenance.yml checks those (go-version job).

version: 2
updates:
  # Go modules of the service and of the JWT probe.
  - package-ecosystem: gomod
    directories:
      - /
      - /test/probes/jwt-go-oidc
    schedule:
      interval: weekly
      day: monday
    groups:
      go-modules:
        patterns: ["*"]

  # actions/*, docker/* in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  # Base images of the Dockerfile (golang:1.27-trixie, debian:trixie-slim).
  # A pull request for golang:1.28-trixie is the reminder for the switch;
  # go.mod has to be changed in the same pull request.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Images of the test stacks (Keycloak, Mosquitto, PostgreSQL).
  # Mosquitto follows the production version: merge an update of it
  # only together with the update of production.
  # The authentik tag is set via ${AUTHENTIK_TAG:-…} and is checked by hand.
  - package-ecosystem: docker-compose
    directories:
      - /test/integration/broker
      - /test/integration/keycloak
      - /test/integration/authentik
    schedule:
      interval: monthly

  # Python packages of the OpenAPI check.
  - package-ecosystem: pip
    directory: /test/openapi
    schedule:
      interval: monthly
    groups:
      openapi-check:
        patterns: ["*"]
