name: CI

on:
  pull_request:
  # main, tags and the weekly rebuild run this workflow from release.yml
  # before the image is pushed.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (default: the ref of the caller)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Newest patch release of the Go minor version of the image
      # (golang:<minor>-trixie); maintenance.yml checks that go.mod uses
      # the same minor version.
      - id: go
        name: Go version of the image
        run: echo "version=$(sed -nE 's/^FROM .*golang:([0-9]+\.[0-9]+)[-.@ ].*/\1/p' Dockerfile | head -n 1).x" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
      - name: go.mod and go.sum tidy
        run: go mod tidy -diff
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal test)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test (unit)
        env:
          PMSS_TEST_RECORD_DIR: ${{ runner.temp }}/records
        run: go test -race ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: OpenAPI document against routes and recorded responses
        run: |
          pip install -q -r test/openapi/requirements.txt
          python3 test/openapi/check.py --records "$RUNNER_TEMP/records" --require-all
      - name: go build
        run: go build -trimpath -o /dev/null ./cmd/phylax-mqtt-security-service

  # Build only, no push. Pushing to ghcr.io follows with the release workflow.
  docker:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci-${{ github.sha }}
