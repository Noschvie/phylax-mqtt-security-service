name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build
        run: go build -trimpath -o /dev/null ./cmd/phylax-mqtt-security-service

  # Build only, no push. Pushing to ghcr.io follows with the release workflow.
  docker:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci-${{ github.sha }}
      - name: Smoke test (linux/amd64)
        run: |
          docker buildx build --load -t pmss:ci --build-arg VERSION=ci-${{ github.sha }} .
          docker run --rm pmss:ci version
          docker run -d --name pmss -p 8080:8080 pmss:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          docker exec pmss /usr/local/bin/phylax-mqtt-security-service healthcheck
          docker stop -t 20 pmss
          docker logs pmss
          # SIGTERM must end in a graceful shutdown with exit code 0.
          test "$(docker inspect -f '{{.State.ExitCode}}' pmss)" = 0
