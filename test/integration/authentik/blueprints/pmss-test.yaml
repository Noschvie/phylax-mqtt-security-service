# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Test configuration for the authentik probe, counterpart of the Keycloak
# realm pmss-test (test/integration/keycloak/realm). Fixed test secrets;
# exists only for these tests.
#
#   tasmofleet-test   TasmoFleet: user tokens, performs the token exchange
#   pmss              Security Service: target of the exchange, issuer and
#                     audience the service checks
#   other-app         another application of the same users (negative test)
version: 1
metadata:
  name: PMSS test
  labels:
    blueprints.goauthentik.io/description: Test providers, users and policy for the PMSS identity provider probe
entries:
  # --- prerequisites ---------------------------------------------------
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  - model: authentik_crypto.certificatekeypair
    id: signing
    identifiers:
      name: pmss-test-signing
    attrs:
      certificate_data: !File /pmss-keys/signing.crt
      key_data: !File /pmss-keys/signing.key

  # --- scopes of the Security Service -----------------------------------
  # authentik grants a requested scope when the provider has a scope
  # mapping with that name; it does not depend on the user. read carries
  # the user name for the audit of the service.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-read
    identifiers:
      managed: pmss-test/scope-read
    attrs:
      name: "PMSS test: read"
      scope_name: read
      expression: |
        return {"preferred_username": request.user.username}
  - model: authentik_providers_oauth2.scopemapping
    id: scope-write
    identifiers:
      managed: pmss-test/scope-write
    attrs:
      name: "PMSS test: write"
      scope_name: write
      expression: |
        return {}

  # --- groups and users --------------------------------------------------
  - model: authentik_core.group
    id: security-admin
    identifiers:
      name: security-admin

  - model: authentik_core.user
    id: alice
    identifiers:
      username: alice
    attrs:
      name: Alice (security-admin)
      type: internal
      password: alice
      groups:
        - !KeyOf security-admin
  - model: authentik_core.user
    id: bob
    identifiers:
      username: bob
    attrs:
      name: Bob
      type: internal
      password: bob
  - model: authentik_core.user
    id: msm-test-rw
    identifiers:
      username: msm-test-rw
    attrs:
      name: Service account read/write
      type: service_account
      groups:
        - !KeyOf security-admin
  - model: authentik_core.user
    id: msm-test-ro
    identifiers:
      username: msm-test-ro
    attrs:
      name: Service account read only
      type: service_account
  - model: authentik_core.user
    id: msm-test-rw-norole
    identifiers:
      username: msm-test-rw-norole
    attrs:
      name: Service account without security-admin
      type: service_account

  # App passwords: authentik's form of the password grant
  # (grant_type=client_credentials with username and password).
  - model: authentik_core.token
    identifiers:
      identifier: pmss-test-alice
    attrs:
      intent: app_password
      user: !KeyOf alice
      expiring: false
      key: alice-app-password
  - model: authentik_core.token
    identifiers:
      identifier: pmss-test-bob
    attrs:
      intent: app_password
      user: !KeyOf bob
      expiring: false
      key: bob-app-password
  - model: authentik_core.token
    identifiers:
      identifier: pmss-test-msm-test-rw
    attrs:
      intent: app_password
      user: !KeyOf msm-test-rw
      expiring: false
      key: msm-test-rw-secret
  - model: authentik_core.token
    identifiers:
      identifier: pmss-test-msm-test-ro
    attrs:
      intent: app_password
      user: !KeyOf msm-test-ro
      expiring: false
      key: msm-test-ro-secret
  - model: authentik_core.token
    identifiers:
      identifier: pmss-test-msm-test-rw-norole
    attrs:
      intent: app_password
      user: !KeyOf msm-test-rw-norole
      expiring: false
      key: msm-test-rw-norole-secret

  # --- TasmoFleet ----------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: tasmofleet-test
    identifiers:
      name: tasmofleet-test
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: tasmofleet-test
      client_secret: tasmofleet-test-secret
      redirect_uris:
        - matching_mode: strict
          url: http://127.0.0.1:8443/oidc/callback
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
        - refresh_token
        - client_credentials
        - urn:ietf:params:oauth:grant-type:token-exchange
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
      signing_key: !KeyOf signing
      access_token_validity: minutes=5
  - model: authentik_core.application
    id: app-tasmofleet-test
    identifiers:
      slug: tasmofleet-test
    attrs:
      name: TasmoFleet (test)
      provider: !KeyOf tasmofleet-test

  # --- another application (negative test) -------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: other-app
    identifiers:
      name: other-app
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: other-app
      client_secret: other-app-secret
      redirect_uris:
        - matching_mode: strict
          url: http://127.0.0.1:9999/callback
          redirect_uri_type: authorization
      grant_types:
        - client_credentials
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !KeyOf signing
      access_token_validity: minutes=5
  - model: authentik_core.application
    identifiers:
      slug: other-app
    attrs:
      name: Other application (test)
      provider: !KeyOf other-app

  # --- Security Service ----------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: pmss
    identifiers:
      name: pmss
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # aud of every token of this provider; same value as in Keycloak
      client_id: phylax-mqtt-security-service
      client_secret: pmss-test-secret
      redirect_uris:
        - matching_mode: strict
          url: http://127.0.0.1:9999/unused
          redirect_uri_type: authorization
      grant_types:
        - client_credentials
      property_mappings:
        - !KeyOf scope-read
        - !KeyOf scope-write
      signing_key: !KeyOf signing
      access_token_validity: minutes=5
      # Only TasmoFleet may mint tokens for the Security Service
      jwt_federation_providers:
        - !KeyOf tasmofleet-test
  - model: authentik_core.application
    id: app-pmss
    identifiers:
      slug: pmss
    attrs:
      name: Phylax MQTT Security Service (test)
      provider: !KeyOf pmss

  # write only for members of security-admin (counterpart of the role scope
  # mapping in Keycloak). The policy sees the requested scopes; it can only
  # refuse the whole request, not drop the scope.
  - model: authentik_policies_expression.expressionpolicy
    id: write-requires-security-admin
    identifiers:
      name: pmss-test-write-requires-security-admin
    attrs:
      expression: |
        scopes = request.context.get("oauth_scopes") or set()
        if "write" not in scopes:
            return True
        return ak_is_group_member(request.user, name="security-admin")
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf write-requires-security-admin
      target: !KeyOf app-pmss
    attrs:
      order: 0
